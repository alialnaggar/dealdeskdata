version: 1
status: executable_contract_draft_before_row_generation
scope: generated_rows_and_agent_facing_json

# ISO weekday numbers are used in PostgreSQL JSON arrays and Python date logic.
calendar:
  iso_weekday_numbers:
    Mon: 1
    Tue: 2
    Wed: 3
    Thu: 4
    Fri: 5
    Sat: 6
    Sun: 7
  default_working_weekdays: [1, 2, 3, 4, 5]
  holidays_mode: omitted_from_phase1c
  holiday_dates_must_be_empty: true
  date_precision_rule: a confirmed receipt on date D may support production on D; no arrival hour is claimed

controlled_vocabularies:
  catalog_version: CATALOGUE_2026_V1
  policy_set_codes: [BASELINE_2026, LENIENT_EXPERIMENT, STRICT_EXPERIMENT]
  countries: [DE, FR, NL, BE, AT]
  destination_regions:
    DE: [DE-BE, DE-NW, DE-BY, DE-BW]
    FR: [FR-IDF, FR-ARA, FR-PAC, FR-HDF]
    NL: [NL-NH, NL-ZH, NL-UT, NL-NB]
    BE: [BE-BRU, BE-VLG, BE-WAL]
    AT: [AT-9, AT-3, AT-5, AT-7]
  installation_service_countries: [DE, FR, NL]
  installation_service_regions:
    DE: [DE-BE, DE-NW]
    FR: [FR-IDF, FR-ARA]
    NL: [NL-NH, NL-ZH]
  customer_industry_codes:
    - manufacturing
    - retail
    - financial_services
    - healthcare
    - education
    - public_sector
    - logistics
    - professional_services
  customer_industry_target_share_pct:
    manufacturing: 20
    retail: 15
    financial_services: 12.5
    healthcare: 10
    education: 7.5
    public_sector: 5
    logistics: 10
    professional_services: 20
  customer_country_target_share_pct:
    DE: 35
    FR: 20
    NL: 20
    BE: 15
    AT: 10
  location_codes:
    WH-EU-CENTRAL:
      country_code: DE
      region: DE-NW
      time_zone: Europe/Berlin
      working_weekdays: [1, 2, 3, 4, 5]
    WH-EU-WEST:
      country_code: NL
      region: NL-NH
      time_zone: Europe/Amsterdam
      working_weekdays: [1, 2, 3, 4, 5]
  salesperson_code_pattern: ^SALES-[0-9]{3}$
  service_codes: [standard, express]
  payment_terms_days: [15, 30, 45, 60, 90]
  contract_clause_codes: [standard, preapproved_variant, legal_review, prohibited]
  dataset_types: [historical, generated_test, evaluation]
  agent_names: [Configuration, Pricing, Availability, Credit, Policy, Approval, Orchestrator]

supplier_order_calendar:
  required_keys: [working_weekdays, holiday_dates, time_zone]
  working_weekdays: [1, 2, 3, 4, 5]
  holiday_dates: []
  holiday_policy: no public-holiday model in Phase 1C; do not claim holiday-aware lead times

json_contracts:
  products_attributes_json:
    common_required:
      archetype_code: string
      demand_class: [core, regular, niche]
    common_optional:
      fulfillment_lead_days: nonnegative_integer
      installation_eligible: boolean
      supported_installation_regions: region_code_array
    mode_rules:
      digital_activation:
        required: [edition]
        optional: [service_tier, feature_codes]
        configuration_identity_keys: [edition, service_tier, feature_codes]
      scheduled_service:
        required: [service_code]
        optional: [fulfillment_lead_days]
      physical:
        required: []
        optional: [installation_eligible, supported_installation_regions, option_codes]
      component:
        required: []
        optional: [component_family]
  deal_terms_json:
    required_on_submission:
      payment_terms_days: payment_terms_days
      contract_clause_codes: contract_clause_code_array_nonempty
      allow_partial_delivery: boolean
    optional:
      contract_months: positive_integer
    forbidden_keys: [payment_method]
    contract_months_rule: required when any recurring line exists; annual units require a multiple of 12
  deal_line_configuration_json:
    physical_allowed_keys: [option_codes, selected_options, configuration_signature]
    digital_required_keys: [edition, units_per_period]
    digital_allowed_keys: [edition, units_per_period, service_tier, feature_codes]
    digital_rules:
      units_per_period: positive_integer
      edition: must equal the product's attributes_json.edition
    make_to_order_allowed_keys: [configuration_signature, selected_options]
    unknown_keys: reject
  requirements_json:
    allowed_keys: [requested_outcomes, constraints, customer_notes]
    requested_outcomes: string_array
    constraints:
      item_keys: [code, value]
      code: nonempty_string
      value: scalar_or_string_array
    customer_notes: string
    rule_inputs_must_be_typed: true
  evidence_refs_json:
    item_keys: [evidence_ref, evidence_type, source_class, issued_at]
    evidence_ref: nonempty_string
    evidence_type: [customer_document, supplier_commitment, capacity_snapshot, credit_commitment, provider_proof, installation_coverage]
    source_class: [synthetic_sales_input, synthetic_supplier_manifest, synthetic_capacity_manifest, synthetic_credit_manifest, synthetic_provider_manifest, synthetic_catalogue_rule]
    issued_at: iso_datetime
    reference_alone_is_not_evidence: true
  configuration_signature_json:
    canonicalization: recursively sort object keys; arrays retain declared order; compact JSON for comparison
    allowed_top_level_keys: [edition, service_tier, feature_codes, option_codes, selected_options]
    empty_object_allowed: true
  compatibility_condition_json:
    allowed_rule_types: [requires_product, excludes_product, attribute_constraint, required_deal_field, installation_eligibility]
    required_keys_by_rule_type:
      requires_product: [operator]
      excludes_product: [operator]
      attribute_constraint: [attribute, operator, expected]
      required_deal_field: [field]
      installation_eligibility: [country_code, region_codes, eligible]
    unknown_keys: reject
  provider_evidence_record:
    required_keys: [evidence_ref, product_id, provider_id, configuration_signature_json, region_code, term_code, capacity_unit, capacity_total, quantity_allocated, commitment_status, verified_at, covers_from, covers_until]
    commitment_status: [binding, provisional, unknown]
    full_term_required_for_binding: true
    verification_age_calendar_days_max: 7
  agent_output_json:
    required_keys: [agent_name, status, findings]
    status: [supported, conditional, unknown, infeasible, blocked]
    finding_keys: [code, severity, message, evidence_refs]
    finding_severity: [info, warning, approval_required, blocker]
    evidence_refs: string_array
    no_private_chain_of_thought: true
    route_is_not_approval: true

generation_boundaries:
  source_rows_must_not_be_copied: true
  external_sources_supply: [taxonomy_shape, visible_price_anchors, transformed_frequency_shape, structural_relationships]
  synthetic_only_fields: [ids, names, credit_limits, stock, supplier_leads, capacity_hours, policy_thresholds, test_conflicts]
  reference_fixtures_are_test_only: true
  actual_delivery_events_in_schema: false
