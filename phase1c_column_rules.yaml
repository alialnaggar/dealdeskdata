schema_source: schema.sql
schema_version: Phase 1C Schema V2, 24 tables
status: draft_pre_generation
basis_codes:
  SYS: generated/system observation
  SYN: fictional company assumption
  CAT: catalogue taxonomy/visible anchor, transformed to brand-neutral synthetic product
  OBS: transformed shape of Olist observations, never copied rows
  CFG: declared policy/catalogue configuration
  DER: computed from other facts
  SUB: submitted deal input, synthetically sampled in generated rows
common_checks:
- SQL types, nullability, unique keys, foreign keys, row checks and triggers in schema.sql always apply.
- All synthetic generated fields retain a seed/config hash; IDs and names are fictional; no external source rows copied.
- At a run, use only evidence at or before as_of_at and keep outcome/answer fields out of agent-visible inputs.
- Exception cases change causal source facts and keep all unrelated invariants; record primary and secondary flags separately.
tables:
  products:
    product_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable versioned synthetic identifier
      validation: Unique; one immutable catalogue row per ID
    product_code:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: Brand-neutral archetype code from catalogue taxonomy
      validation: Nonblank; unique with catalog_version; stable across versions
    catalog_version:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: CATALOGUE_2026_V1 for initial catalogue
      validation: Version agrees with BOM, compatibility rules and quoted deal
    product_name:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: Brand-neutral name consistent with category and attributes
      validation: Nonblank; avoid real brand/product claims
    category:
      sql_type: TEXT
      nullable: false
      basis: CAT+SYN
      generation: Nine configured category counts
      validation: One configured category; counts total 120 sellable rows
    product_type:
      sql_type: TEXT
      nullable: false
      basis: CAT+SYN
      generation: Physical, software, subscription, service or component by archetype
      validation: SQL enum; coherent with fulfillment_mode and billing_model
    attributes_json:
      sql_type: JSONB
      nullable: false
      basis: CAT+SYN
      generation: Product-specific typed attribute template from catalogue calibration
      validation: JSON object; required keys, units and option combinations per archetype must be validated
      review_before_generation: Contract defined in phase1c_data_contract.yaml; implement and test archetype-specific row validation and option compatibility.
    list_price:
      sql_type: NUMERIC(14,2)
      nullable: false
      basis: CAT+SYN
      generation: Sample category EUR price band and chosen unit; components may have zero list
      validation: Active sellable price positive and within relevant unit/category band; preserve price-anchor date
      review_before_generation: Recheck catalogue sample dates, currency, unit and category comparability.
    standard_cost:
      sql_type: NUMERIC(14,2)
      nullable: false
      basis: SYN+DER
      generation: Independent category margin draw or BOM materials plus labor and overhead
      validation: Nonnegative; component cost positive; assembled rollup within 5%; portfolio realized margin target checked
      review_before_generation: Prove category/BOM costs and achieved portfolio margin from pilot rows.
    billing_model:
      sql_type: TEXT
      nullable: false
      basis: CAT+CFG
      generation: Choose by sellable product archetype; components not_applicable
      validation: SQL enum; recurring only with supported recurring UOM
    unit_of_measure:
      sql_type: TEXT
      nullable: false
      basis: CAT+CFG
      generation: Unit consistent with billing model and product archetype
      validation: SQL enum; term conversion must match deal_lines.quantity
    is_active:
      sql_type: BOOLEAN
      nullable: false
      basis: SYN
      generation: Active catalogue coverage with deliberate retired version examples
      validation: Boolean; no inactive product in new deal line
    is_sellable:
      sql_type: BOOLEAN
      nullable: false
      basis: SYN
      generation: 120 sellable SKUs; proposed components nonsellable
      validation: Boolean; components false and quote lines true
    fulfillment_mode:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: Stocked, supplier, assembly, digital, service or component by product
      validation: SQL enum; operational rows and BOM only for matching mode
    stock_uom:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: each/component_unit for physical, not_applicable for digital/service
      validation: SQL check; distinguish stock unit from billable unit
  customers:
    customer_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable synthetic customer key
      validation: PK; credit, AR, history and deal FKs resolve
    customer_code:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Unique fictional customer code
      validation: Nonblank and unique; never a real-company identifier
    customer_name:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Fictional/Faker name
      validation: Nonblank; no imported client records
    size_segment:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Exact 36 SMB, 28 Mid-Market, 16 Enterprise
      validation: SQL enum and exact total 80
    strategic_account:
      sql_type: BOOLEAN
      nullable: false
      basis: SYN
      generation: About eight, mainly Enterprise with some Mid-Market
      validation: Boolean; enforce selected segment allocation, do not imply good credit
    industry:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Controlled fictional B2B industry mix
      validation: Nonblank and on configured industry list before freeze
      review_before_generation: Industry vocabulary and synthetic proportions are defined in phase1c_data_contract.yaml; run pilot distribution validation.
    country_code:
      sql_type: CHAR(2)
      nullable: false
      basis: SYN
      generation: Two-letter supported customer country
      validation: Uppercase ISO-style code; do not treat as shipping destination
      review_before_generation: Country/region vocabulary and synthetic shares are defined in phase1c_data_contract.yaml; run pilot distribution validation.
    region:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Country-compatible customer region
      validation: Nonblank and belongs to chosen country code
    customer_since:
      sql_type: DATE
      nullable: false
      basis: SYN
      generation: Date before generated activity
      validation: Not after first invoice/deal or generation as-of
    account_status:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Active/Inactive/Suspended/Blocked for conflict coverage
      validation: SQL enum; baseline decisions block nonactive accounts
  suppliers:
    supplier_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable synthetic supplier/provider key
      validation: PK; offers, POs and digital provider FKs resolve
    supplier_code:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Unique fictional supplier code
      validation: Nonblank and unique
    supplier_name:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Fictional company name
      validation: Nonblank; not an actual provider attestation
    country_code:
      sql_type: CHAR(2)
      nullable: false
      basis: SYN
      generation: Supplier operating country
      validation: Two uppercase letters, from declared supplier geography
    status:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Active/inactive, with inactive edge cases
      validation: SQL enum; inactive supplier must not support new commitment
    order_calendar_json:
      sql_type: JSONB
      nullable: false
      basis: SYN
      generation: Explicit working weekdays/holiday convention per supplier
      validation: Typed JSON object; lead-workday calculation uses this calendar, not generic date addition
      review_before_generation: Calendar JSON shape and weekday-only convention are defined in phase1c_data_contract.yaml; implement supplier workday validation.
  pricing_rules:
    pricing_rule_id:
      sql_type: TEXT
      nullable: false
      basis: SYS+CFG
      generation: Stable ID compiled from profile and rule code
      validation: PK and deterministic across repeat compile
    policy_set_code:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Baseline, lenient or strict profile
      validation: SQL enum; complete 33 pricing rows over three profiles
    rule_name:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Human-readable compiled rule name
      validation: Nonblank, stable; not used alone to decide
    rule_type:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Volume, segment or category floor
      validation: SQL enum; matches condition/action grammar
    scope_type:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Global/product/category/segment/region
