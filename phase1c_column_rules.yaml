    scope_value:
      sql_type: TEXT
      nullable: true
      basis: CFG
      generation: Null global, otherwise matching catalogue/segment/region key
      validation: Scope exists and matches scope_type
    condition_json:
      sql_type: JSONB
      nullable: false
      basis: CFG
      generation: Deterministic typed compiler output
      validation: JSON object; interpreter accepts complete grammar only
    action_json:
      sql_type: JSONB
      nullable: false
      basis: CFG
      generation: Deterministic typed ceiling/floor or discount action
      validation: JSON object; numeric boundaries monotone and valid
    priority:
      sql_type: INTEGER
      nullable: false
      basis: CFG
      generation: Stable explicit conflict precedence
      validation: Integer; deterministic ordering and no ambiguous equal-priority conflict
    is_stackable:
      sql_type: BOOLEAN
      nullable: false
      basis: CFG
      generation: Explicit rule stacking setting
      validation: Boolean; selected rule semantics tested at overlaps
    is_active:
      sql_type: BOOLEAN
      nullable: false
      basis: CFG
      generation: Active compiled policy rows
      validation: Boolean; complete active profile required for interpretation
  policy_rules:
    policy_rule_id:
      sql_type: TEXT
      nullable: false
      basis: SYS+CFG
      generation: Stable compiled profile/rule ID
      validation: PK and deterministic
    policy_set_code:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Baseline, lenient or strict profile
      validation: SQL enum; complete 51 policy rows over three profiles
    rule_name:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Human-readable compiled rule name
      validation: Nonblank; not decision logic by itself
    policy_area:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Pricing/margin/payment/contract/credit/delivery
      validation: SQL enum and condition type agree
    scope_type:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Global/product/category/segment/region
      validation: SQL enum; global iff scope_value null
    scope_value:
      sql_type: TEXT
      nullable: true
      basis: CFG
      generation: Key for chosen scope, null for global
      validation: Resolvable configured product/category/segment/region
    condition_json:
      sql_type: JSONB
      nullable: false
      basis: CFG
      generation: Typed condition from compiler
      validation: JSON object; parse and validate every operator/threshold
    severity:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Info/warning/approval_required/blocker
      validation: SQL enum; matches required_action and hard block semantics
    required_action:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Continue/request_exception/escalate/reject
      validation: SQL enum; blocker must reject
    explanation_template:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Versioned human explanation template
      validation: Nonblank; references only declared condition fields
    priority:
      sql_type: INTEGER
      nullable: false
      basis: CFG
      generation: Stable deterministic conflict precedence
      validation: Integer; most severe applicable rule wins
    is_active:
      sql_type: BOOLEAN
      nullable: false
      basis: CFG
      generation: Active compiled rule
      validation: Boolean; selected profile must be complete
  approval_rules:
    approval_rule_id:
      sql_type: TEXT
      nullable: false
      basis: SYS+CFG
      generation: Stable profile/rule ID
      validation: PK and deterministic
    policy_set_code:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Baseline, lenient or strict profile
      validation: SQL enum; complete 21 approval rows over three profiles
    rule_name:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Human-readable compiled rule name
      validation: Nonblank; not authority by itself
    condition_json:
      sql_type: JSONB
      nullable: false
      basis: CFG
      generation: Typed routing trigger from compiler
      validation: JSON object; parse complete grammar and threshold inclusivity
    required_role:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Regional_Manager/Sales_Director/Sales_VP/Finance_Director/Legal_Compliance
      validation: SQL enum; role required by matching trigger only
    approval_sequence:
      sql_type: INTEGER
      nullable: false
      basis: CFG
      generation: Explicit ordering of applicable reviewers
      validation: Nonnegative; ordered and deduplicated routing
    is_mandatory:
      sql_type: BOOLEAN
      nullable: false
      basis: CFG
      generation: Mandatory versus optional review
      validation: Boolean; no actual approval implied
    priority:
      sql_type: INTEGER
      nullable: false
      basis: CFG
      generation: Stable rule precedence
      validation: Integer; reproducible on replay
    is_active:
      sql_type: BOOLEAN
      nullable: false
      basis: CFG
      generation: Active compiled rule
      validation: Boolean; profile completeness check
  compatibility_rules:
    compatibility_rule_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable synthetic rule ID
      validation: PK
    catalog_version:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Catalogue version of all referenced products
      validation: Same version as source and target products
    rule_name:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: Named technical dependency/eligibility
      validation: Nonblank; not executable by name alone
    rule_type:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: Requires/excludes/attribute/required-field/installation
      validation: SQL enum; subject and condition agree
    scope_type:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Line/configured_group/whole_deal
      validation: SQL enum; group scope evaluated across all grouped lines
    source_product_id:
      sql_type: TEXT
      nullable: true
      basis: SYN+CAT
      generation: Source SKU or null for global condition
      validation: If present FK and matching catalogue version; dependencies require source
    target_product_id:
      sql_type: TEXT
      nullable: true
      basis: SYN+CAT
      generation: Required/excluded SKU or null when inapplicable
      validation: If present FK/version; dependency needs target; not same as source
    condition_json:
      sql_type: JSONB
      nullable: false
      basis: SYN+CAT
      generation: Versioned typed configuration/region predicate
      validation: JSON object; executable grammar and missing-key result defined before generation
      review_before_generation: Predicate shape and installation regions are defined in phase1c_data_contract.yaml; complete dependency coverage and row execution.
    severity:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Warning or blocker based on dependency
      validation: SQL enum; blocker prevents supported quote
    message:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Plain-language finding template
      validation: Nonblank and consistent with condition
    priority:
      sql_type: INTEGER
      nullable: false
      basis: SYN
      generation: Stable order for overlapping rules
      validation: Integer; ambiguous simultaneous rules rejected
    is_active:
      sql_type: BOOLEAN
      nullable: false
      basis: SYN
      generation: Current catalogue rules
      validation: Boolean; inactive rule does not decide
  bom_headers:
    bom_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable BOM variant identifier
      validation: PK; lines and production requirements resolve
    finished_product_id:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: One make_to_order sellable product
      validation: FK/version; active effective variants cover chosen configurations
    catalog_version:
      sql_type: TEXT
      nullable: false
      basis: CFG
      generation: Same catalogue as finished SKU/components
      validation: Composite FK and no cross-version recipe
    bom_version:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Explicit revision string
      validation: Unique with product/version/signature
    configuration_signature_json:
      sql_type: JSONB
      nullable: false
      basis: SYN+CAT
      generation: Canonical option signature for offered build
      validation: Typed JSON object; exactly one active effective BOM matches deal option signature
      review_before_generation: Canonical signature shape is defined in phase1c_data_contract.yaml; prove 18 make-to-order SKUs and 24-36 effective variants cover offered configurations.
    output_quantity:
      sql_type: NUMERIC(14,3)
      nullable: false
      basis: SYN
      generation: Positive finished units yielded by a BOM run
      validation: SQL positive; component needs scale by output quantity
    effective_from:
      sql_type: TIME
      nullable: false
      basis: SYN
      generation: Revision start timestamp
      validation: At/before eligible deal run; no active overlapping same signature
    effective_to:
      sql_type: TIME
      nullable: true
      basis: SYN
      generation: Null open-ended or later retirement time
      validation: Greater than start; no overlap for active equivalent BOMs
    status:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Active/inactive revision
      validation: SQL enum; only effective active variant selectable
  bom_lines:
    bom_line_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable recipe line ID
      validation: PK and unique BOM/component pair
    bom_id:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Parent configured BOM
      validation: FK; every active offered BOM has nonempty mandatory component coverage
    component_product_id:
      sql_type: TEXT
      nullable: false
      basis: SYN+CAT
      generation: Same-version non-sellable component
      validation: FK; component mode, no self/cycle, UOM compatible
    required_quantity_per_output:
      sql_type: NUMERIC(14,3)
      nullable: false
      basis: SYN
      generation: Positive component units per finished output
      validation: SQL positive; total requirement scaled by quote and scrap
    scrap_pct:
      sql_type: NUMERIC(5,2)
      nullable: false
      basis: SYN
      generation: Configured component loss percent
      validation: 0 to below 100; cost and quantity both apply same loss convention
    substitute_group_code:
      sql_type: TEXT
      nullable: true
      basis: SYN
      generation: Null or explicit substitute group for this BOM
      validation: Nonblank when present; group alternatives share a validated function
    priority:
      sql_type: INTEGER
      nullable: false
      basis: SYN
      generation: Deterministic choice within substitute group
      validation: Nonnegative; exactly one preferred valid option
    is_mandatory:
      sql_type: BOOLEAN
      nullable: false
      basis: SYN
      generation: Required versus allowed alternative
      validation: Boolean; all mandatory components counted once
  customer_credit_profiles:
    customer_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: One profile per customer
      validation: PK/FK; every generated active customer has profile
    credit_limit:
      sql_type: NUMERIC(14,2)
      nullable: false
      basis: SYN
      generation: Segment triangular EUR limits, strategic multiplier and cap
      validation: Positive; SMB 20k/75k/200k, Mid 100k/300k/750k, Enterprise 400k/1.2m/3m; capped at 4m
    unbilled_committed_amount:
      sql_type: NUMERIC(14,2)
      nullable: false
      basis: SYN+DER
      generation: Dated open commitment amount excluding invoiced AR and current deal
      validation: Nonnegative; no double count in post-deal exposure
    commitments_as_of_at:
      sql_type: TIME
      nullable: false
      basis: SYS
      generation: Source observation timestamp for unbilled commitments
      validation: Not after run as_of_at; freshness rule applied
    commitment_evidence_ref:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Controlled independent source reference
      validation: Nonblank; resolves to generator evidence manifest
      review_before_generation: Define independent commitment evidence manifest and completeness marker.
    risk_rating:
      sql_type: TEXT
      nullable: false
      basis: SYN+DER
      generation: 44 Low, 28 Medium, 8 High; payment behavior sampled conditionally
      validation: SQL enum and exact counts; never derive from current target decision
    credit_status:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: 72 Active, 5 Review, 3 On-Hold
      validation: SQL enum and exact counts; On-Hold blocks regardless of spare limit
    default_payment_terms_days:
      sql_type: INTEGER
      nullable: false
      basis: SYN
      generation: Segment-specific exact terms quotas
      validation: SQL enum; aggregate 8/36/20/13/3 for 15/30/45/60/90
    last_review_date:
      sql_type: DATE
      nullable: false
      basis: SYN
      generation: Credit review date at or before current run
      validation: Not after as-of date; freshness applied
    next_review_date:
      sql_type: DATE
      nullable: true
      basis: SYN
      generation: Optional scheduled next review
      validation: Null or at/after last_review_date; overdue review flagged
  accounts_receivable:
    receivable_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Stable dated invoice snapshot ID
      validation: PK; unique invoice_number currently restricts one stored snapshot per invoice
    customer_id:
      sql_type: TEXT
      nullable: false
      basis: SYS
      generation: Owner of invoice
      validation: FK; matches payment record if linked by invoice_number
    invoice_number:
      sql_type: TEXT
      nullable: false
      basis: SYN
      generation: Unique fictional invoice key
      validation: SQL unique; no collision with other customer's invoice
    invoice_date:
      sql_type: DATE
      nullable: false
      basis: SYN
      generation: Issue date after customer_since
      validation: At/before due and snapshot date; at/before run when selected
    due_date:
      sql_type: DATE
      nullable: false
      basis: SYN
      generation: Invoice date plus accepted term or recorded historical term
      validation: At/after invoice; overdue iff due before as_of and unpaid
    original_amount:
      sql_type: NUMERIC(14,2)
      nullable: false
      basis: SYN+DER
      generation: Positive invoice amount correlated with customer/deal size
