implementation_notes:
- Compile pricing_rules, policy_rules and approval_rules from governance.profiles; do not store the whole YAML as
  a policy row.
- Rule conditions and actions must be structured JSON; scope_value is null for global scope.
- Use catalog_version for technical compatibility only and policy_set_code for commercial governance only.
- For payment term hard caps, a valid allowed term above the cap blocks; invalid term also blocks.
- Baseline historical line discounts follow commercial_supply.requested_discount, independently of generated_test
  injection.
- The 100 generated_test cases give integer case counts equal to the requested percentages; use fixed seed and record
  unsatisfied cases.
- The current AR snapshot is a current-state view. Historical outcomes are generated in chronological order from
  transient facts and cannot be recomputed from the current credit and AR tables.
- Compute current exposure from unpaid AR plus the dated unbilled_committed_amount aggregate on the credit profile;
  do not also sum open deals, and exclude the current proposal and any amount represented in AR.
- For monthly or yearly recurring products, deal_lines.quantity counts all billable units over the quoted term.
  Reject a line whose quantity conflicts with contract_months and units_per_period.
- Apply the same deal to all policy sets through an evaluation-only runtime override; input_snapshot_json must log
  both persisted and applied policy_set_code.
- Check both each line and revenue-weighted deal discount; no weighted average may hide a line above a hard discount
  cap.
- Within a category-floor deviation the Sales VP may review; beyond the profile limit, or at nonpositive margin,
  hard block.
- Category product_type_mix and billing_model entries are generator templates; product rows store one concrete billing
  model and one unit_of_measure from dataset enumerations.
- Original 100-deal conflict mix is historical and not a sufficient V2 production-case mix.
- Products contains 120 sellable rows plus separately calibrated component rows; pricing floors do not apply to
  non-sellable components.
- Physical stock and confirmed inbound commitments are aggregate quantity_allocated fields on their dated snapshots;
  there is no reservation-owner table and the proposed deal does not mutate allocations.
- Existing production commitments are aggregate allocated_capacity_hours by location/capability/resource_type/day;
  there is no individual job or machine/worker calendar in this MVP.
- Digital activation confirmation requires exact edition/region/term/unit, available entitlement, valid binding
  commitment evidence and activation lead time; installation checks only product/region eligibility.
- Only confirmed purchase commitments count as confirmed inbound; supplier_items offers are conditional.
- V1 14-table fields alone cannot support the expanded fulfillment agent; use Phase 1C V2 24-table design.
schema_v2:
  status: design_only
  table_count: 24
  retained_tables:
  - products
  - compatibility_rules
  - customers
  - customer_credit_profiles
  - accounts_receivable
  - payment_history
  - pricing_rules
  - policy_rules
  - inventory
  - inbound_supply
  - deals
  - deal_lines
  - approval_rules
  - agent_execution_log
  added_tables:
  - bom_headers
  - bom_lines
  - suppliers
  - supplier_items
  - purchase_orders
  - production_requirements
  - production_capacity
  - digital_capacity
  - deal_runs
  - shipping_lanes
  changed_existing_columns:
    inventory: quantity_on_hand and quantity_allocated as one product/location/as-of snapshot; no owner link
    products: add immutable catalog_version plus is_sellable, fulfillment_mode and stock_uom; unique product_code/catalog_version
    compatibility_rules: line/configured_group/whole_deal scopes and installation product/region eligibility
    customer_credit_profiles: dated unbilled_committed_amount aggregate with evidence reference and no AR overlap
    deals: salesperson_id, immutable submission with supersedes_deal_id; destination, terms, justification and evidence references
    deal_lines: product-level configuration, fulfillment_group_code, requested_activation_date and installation_requested
    inbound_supply: purchase_orders commitment reference, confirmation/validity evidence and quantity_allocated
    agent_execution_log: run_id foreign key to deal_runs, attempt trace and versions consistent with run
  key_invariants:
  - inventory_quantity_allocated_between_zero_and_quantity_on_hand_at_same_snapshot
  - inbound_quantity_allocated_between_zero_and_quantity_at_same_snapshot
  - aggregate_allocations_include_only_existing_commitments_and_are_not_subtracted_again_from_deal_rows
  - evaluation_simulates_one_deal_across_all_lines_without_mutating_stock_inbound_or_capacity
  - two_separate_uncommitted_quotes_may_compete_for_same_spare_capacity_and_are_not_guarantees
  - a_confirmed_receipt_has_documented_supplier_commitment_before_evaluation_time
  - received_supply_is_not_counted_again_as_inbound
  - a_supplier_offer_is_never_misclassified_as_confirmed_inbound
  - one_effective_BOM_matches_each_make_to_order_configuration
  - BOMs_are_acyclic_and_components_have_compatible_stock_units
  - production_requirements_order_steps_by_operation_seq_and_join_matching_capability_type_location_day
  - allocated_capacity_hours_between_zero_and_net_available_capacity_hours
  - both_equipment_and_workforce_free_daily_hours_cover_each_required_step
  - capacity_uses_day_precision_not_exact_hour_or_named_worker_machine_scheduling
  - a_proposed_quote_never_creates_a_committed_PO_or_allocation
  - arrival_includes_dispatch_calendar_and_shipping_lane_transit
  - indivisible_fulfillment_groups_cannot_be_partially_shipped
  - non_sellable_components_are_never_quoted_as_customer_facing_lines
  - credit_and_policy_outputs_remain_independent_from_fulfillment_output
  - credit_aggregate_is_dated_unbilled_and_not_in_accounts_receivable_or_current_proposal
  - digital_activation_confirmed_only_for_exact_edition_region_term_unit_valid_entitlement_and_binding_commitment
  - installation_eligibility_does_not_claim_installer_availability_or_date
  - submitted_deals_immutable_and_run_snapshots_versioned
