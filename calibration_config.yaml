commercial_supply:
  version: 1.0
  approved_date: 2026-09-25
  scope: phase_1c_credit_payment_price_cost_inventory_inbound_supply
  evidence_boundary: *id001
  credit_profiles:
    customer_count: 80
    credit_limit_eur_by_segment:
      SMB:
        minimum: 20000
        mode: 75000
        maximum: 200000
      Mid-Market:
        minimum: 100000
        mode: 300000
        maximum: 750000
      Enterprise:
        minimum: 400000
        mode: 1200000
        maximum: 3000000
    strategic_account_multiplier: 1.25
    maximum_credit_limit_eur: 4000000
    risk_rating_exact_counts:
      Low: 44
      Medium: 28
      High: 8
    credit_status_exact_counts:
      Active: 72
      Review: 5
      On-Hold: 3
    default_payment_terms_exact_counts_by_segment:
      SMB:
        15: 8
        30: 22
        45: 5
        60: 1
        90: 0
      Mid-Market:
        15: 0
        30: 11
        45: 10
        60: 6
        90: 1
      Enterprise:
        15: 0
        30: 3
        45: 5
        60: 6
        90: 2
    relationships:
    - Higher credit limits are more likely for larger and strategic accounts.
    - Risk rating is correlated with payment behavior but is not deterministically derived from it.
    - On-Hold customers must have a documented adverse signal; High risk alone does not force a hold.
    - Review dates must precede next-review dates when a next review exists.
  accounts_receivable:
    snapshot_date: 2026-09-01
    open_invoice_count_by_segment:
      SMB:
        minimum: 0
        mode: 2
        maximum: 4
      Mid-Market:
        minimum: 1
        mode: 3
        maximum: 6
      Enterprise:
        minimum: 2
        mode: 5
        maximum: 10
    outstanding_to_original_amount:
      paid: 0.0
      partial_payment_range:
      - 0.1
      - 0.9
      fully_open: 1.0
    overdue_target_share_range:
    - 0.18
    - 0.28
    customer_exposure_to_credit_limit_target:
      normal_range:
      - 0.1
      - 0.8
      caution_range:
      - 0.8
      - 1.0
      exceeded_range:
      - 1.0
      - 1.25
      exceeded_customer_target_share: 0.1
    required_consistency:
    - outstanding_amount is between zero and original_amount
    - due_date is on or after invoice_date
    - overdue status requires outstanding_amount greater than zero and due_date before snapshot_date
    - paid status requires outstanding_amount equal to zero
  payment_history:
    history_window_months: 24
    paid_invoice_count_by_segment:
      SMB:
        minimum: 8
        mode: 12
        maximum: 16
      Mid-Market:
        minimum: 12
        mode: 18
        maximum: 24
      Enterprise:
        minimum: 18
        mode: 27
        maximum: 36
    payment_delay_day_bands_by_risk:
      Low:
        early_or_on_time:
          share: 0.8
          range:
          - -10
          - 0
        slight_delay:
          share: 0.17
          range:
          - 1
          - 10
        serious_delay:
          share: 0.03
          range:
          - 11
          - 45
      Medium:
        early_or_on_time:
          share: 0.6
          range:
          - -7
          - 0
        slight_delay:
          share: 0.3
          range:
          - 1
          - 15
        serious_delay:
          share: 0.1
          range:
          - 16
          - 60
      High:
        early_or_on_time:
          share: 0.35
          range:
          - -3
          - 0
        slight_delay:
          share: 0.4
          range:
          - 1
          - 20
        serious_delay:
          share: 0.25
          range:
          - 21
          - 90
    strong_payment_history_definition:
      minimum_on_time_share: 0.8
      maximum_average_delay_days: 5
      maximum_serious_delay_share: 0.05
    required_edge_case:
      description: post-deal exposure exceeds credit limit while payment history remains strong
      location: hand_built_evaluation_set
  standard_cost:
    formula: list_price * (1 - target_list_margin_percent / 100)
    rounding: 2_decimal_places
    target_list_margin_percent_by_category:
      end_user_computing_and_digital_workplace:
        p10: 10
        p50: 18
        p90: 28
      servers_and_compute_infrastructure:
        p10: 9
        p50: 16
        p90: 25
      storage_and_data_protection:
        p10: 10
        p50: 19
        p90: 28
      networking_and_connectivity:
        p10: 12
        p50: 21
        p90: 32
      cybersecurity:
        p10: 18
        p50: 32
        p90: 48
      cloud_services_and_subscriptions:
        p10: 22
        p50: 38
        p90: 55
      enterprise_software_and_licensing:
        p10: 25
        p50: 45
        p90: 65
      professional_and_implementation_services:
        p10: 30
        p50: 48
        p90: 65
      managed_support_and_warranty:
        p10: 25
        p50: 42
        p90: 60
    portfolio_validation:
      realized_revenue_weighted_gross_margin_percent_range:
      - 19
      - 25
      reason: brackets_public_2025_integrator_gross_margins_while_preserving_category_mix
    constraints:
    - sellable standard_cost is nonnegative and does not exceed list_price; component standard_cost is positive
      and independently calibrated
    - standard_cost is generated independently of requested quote discount
    - quoted margin may fall below policy floor and must not be silently repaired
    formula_scope: original_sellable_categories_only; assembled_products_require_BOM_cost_rollup
  requested_discount:
    historical_line_target_bands:
      zero:
        range_percent:
        - 0
        - 0
        share: 0.15
      nominal:
        range_percent:
        - 0.01
        - 5
        share: 0.35
      standard:
        range_percent:
        - 5.01
        - 10
        share: 0.25
      negotiated:
        range_percent:
        - 10.01
        - 15
        share: 0.15
      exception:
        range_percent:
        - 15.01
        - 20
        share: 0.07
      senior_exception:
        range_percent:
        - 20.01
        - 30
        share: 0.025
      extreme:
        range_percent:
        - 30.01
        - 40
        share: 0.005
    generation_dependencies:
    - customer segment and strategic-account status
    - category and unit of measure
    - line quantity and applicable pricing rule
    - target realized margin
    note: AdventureWorks discount discreteness supports explicit bands, but its 97.29 percent zero-discount share
      is rejected for a deal-desk experiment.
  availability:
    fulfillment_modes:
      stocked_physical:
        source: inventory_and_inbound_supply
      supplier_order:
        source: confirmed_unallocated_binding_inbound_only; planned_supply_is_conditional
      digital_activation:
        source: digital_capacity_exact_pool_commitment_and_activation_lead_days
      scheduled_service:
        source: products.attributes_json.fulfillment_lead_days
        scope_limit: workforce_capacity_scheduling_is_out_of_scope_for_mvp
    inventory_locations:
    - WH-EU-CENTRAL
    - WH-EU-WEST
    inventory_state_target_share:
      healthy: 0.55
      tight: 0.25
      below_reorder: 0.15
      zero_available: 0.05
    available_to_target_stock_ratio_by_state:
      healthy:
      - 0.75
      - 1.3
      tight:
      - 0.35
      - 0.74
      below_reorder:
      - 0.01
      - 0.34
      zero_available:
      - 0.0
      - 0.0
