permissions:
  contents: read

jobs:
  database-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase1c_ci_only
          POSTGRES_DB: deal_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_desk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: phase1c_ci_only
      PGDATABASE: deal_desk_test
      DATABASE_URL: postgresql://postgres:phase1c_ci_only@localhost:5432/deal_desk_test
    steps:
      - name: Check out project files
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply 24-table schema
        run: psql -X -v ON_ERROR_STOP=1 -f schema.sql
      - name: Check constraints and connected rows
        run: psql -X -v ON_ERROR_STOP=1 -f phase1c_schema_smoke.sql
      - name: Check 14 isolated row scenarios
        run: psql -X -v ON_ERROR_STOP=1 -f phase1c_row_fixtures.sql
      - name: Install read layer dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'PyYAML>=6,<7'
      - name: Check representative and full buildable catalogue master rows
        run: |
          python render_phase1c_master_slice.py --check
          psql -X -v ON_ERROR_STOP=1 -f phase1c_master_slice.sql
          python render_phase1c_master_slice.py --all-buildable --check
          psql -X -v ON_ERROR_STOP=1 -f phase1c_buildable_master.sql
      - name: Check all 156 provisional catalogue products
        run: |
          python -m unittest -v test_render_phase1c_sellable_catalogue
          python render_phase1c_sellable_catalogue.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -c ROLLBACK
      - name: Load five connected provisional deal paths
        run: |
          python -m unittest -v test_phase1c_vertical_pilot.VerticalPilotRenderTests
          python render_phase1c_vertical_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -c ROLLBACK
      - name: Load thirteen connected conflict paths
        run: |
          python -m unittest -v test_phase1c_conflict_pilot.ConflictRenderTests
          python render_phase1c_conflict_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -f phase1c_conflict_pilot.sql -c ROLLBACK
      - name: Load seeded 36-deal development pilot
        run: |
          python -m unittest -v test_phase1c_stress_pilot.StressRenderTests
          python render_phase1c_stress_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -f phase1c_conflict_pilot.sql \
            -f phase1c_stress_pilot.sql -c ROLLBACK
      - name: Validate typed pilot rows and controlled locations
        run: |
          python -m unittest -v test_validate_phase1c_generated_rows
          python validate_phase1c_generated_rows.py --load-pilot
      - name: Validate independent evidence manifest contracts
        run: |
          python -m unittest -v test_validate_phase1c_evidence_manifests
          python - <<'PY'
          import json
          from pathlib import Path
          from validate_phase1c_evidence_manifests import validate_snapshot_manifest
          errors = validate_snapshot_manifest(json.loads(Path('phase1c_pilot_snapshot_manifest.json').read_text()), base_dir=Path('.'), evaluation_at='2026-09-02T00:00:00Z')
          if errors:
              raise SystemExit('; '.join(errors))
          PY
      - name: Validate typed runtime output envelopes
        run: python -m unittest -v test_validate_phase1c_runtime_outputs
      - name: Fail closed on missing historical credit and AR snapshots
        run: python -m unittest -v test_phase1c_historical_credit
      - name: Fail closed on missing historical operational snapshots
        run: python -m unittest -v test_phase1c_historical_operational
      - name: Check connected workstation stock, inbound and capacity rows
        run: psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 -f phase1c_buildable_master.sql -f phase1c_supply_rows.sql
      - name: Validate calibration relationships before generation
        run: |
          python -m unittest -v test_validate_phase1c_calibration
          python validate_phase1c_calibration.py
      - name: Verify rules cover every schema column
        run: |
          python -m unittest -v test_validate_phase1c_column_rules
          python validate_phase1c_column_rules.py
      - name: Validate controlled vocabularies and JSON contracts
        run: |
          python -m unittest -v test_validate_phase1c_data_contract
          python validate_phase1c_data_contract.py
      - name: Check pilot scenario coverage and evaluation isolation
        run: |
          python -m unittest -v test_validate_phase1c_scenario_matrix
          python validate_phase1c_scenario_matrix.py
      - name: Preflight connected pilot rows and SQL constraints
        run: |
          python validate_phase1c_pilot.py
          python -m unittest -v test_validate_phase1c_pilot
      - name: Preflight configured assembly and production capacity
        run: |
          python -m unittest -v test_build_phase1c_portfolio_draft
          python validate_phase1c_bom_portfolio.py phase1c_portfolio_draft.json
          python -m unittest -v test_validate_phase1c_variant_cost_pilot
          python validate_phase1c_variant_cost_pilot.py phase1c_variant_cost_pilot.json
          python validate_phase1c_variant_cost_pilot.py phase1c_build_cost_draft.json
          python -m unittest -v test_validate_phase1c_bom_portfolio
          python -m unittest -v test_audit_phase1c_build_readiness
          python audit_phase1c_build_readiness.py > /tmp/phase1c_build_readiness.json
          python -m unittest -v test_validate_phase1c_technical_fit_pilot
          python validate_phase1c_technical_fit_pilot.py
          python -m unittest -v test_phase1c_component_units
          python -m unittest -v test_phase1c_digital_units
          python -m unittest -v test_phase1c_horizon
          python validate_phase1c_assembly_pilot.py
          python -m unittest -v test_validate_phase1c_assembly_pilot
      - name: Compare reader results with 14 reference scenarios
        run: python -m unittest -v test_phase1c_reader
      - name: Validate and compile synthetic policy profiles
        run: |
          python -m unittest -v test_phase1c_policy_compiler
          python compile_phase1c_policy.py --output /tmp/phase1c_compiled_rules.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/phase1c_compiled_rules.sql
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM deal_desk.pricing_rules) <> 33 OR (SELECT count(*) FROM deal_desk.policy_rules) <> 51 OR (SELECT count(*) FROM deal_desk.approval_rules) <> 21 THEN RAISE EXCEPTION 'Incomplete compiled policy rows'; END IF; END \$\$;"
      - name: Gate the configured portfolio workstation deal
        run: python -m unittest -v test_phase1c_portfolio_deal
      - name: Check bounded scheduled service coverage
        run: python -m unittest -v test_phase1c_service_pilot
      - name: Read five connected generated pilot modes
        run: python -m unittest -v test_phase1c_vertical_pilot.VerticalPilotReaderTests
      - name: Check provisional customer and credit master
        run: python -m unittest -v test_phase1c_customer_master
      - name: Check 400 provisional historical input deals
        run: python -m unittest -v test_phase1c_historical_inputs
      - name: Freeze dated historical credit and AR views
        run: python -m unittest -v test_render_phase1c_historical_credit
      - name: Read thirteen source conflict cases
        run: python -m unittest -v test_phase1c_conflict_pilot.ConflictReaderTests
      - name: Check mixed pilot replay and contention
        run: python -m unittest -v test_phase1c_stress_pilot.StressReaderTests
      - name: Measure pilot decisions and source provenance
        run: python audit_phase1c_pilot_distribution.py --output /tmp/phase1c_pilot_distribution.json
      - name: Preserve pilot diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-pilot-distribution
          path: /tmp/phase1c_pilot_distribution.json
      - name: Test full commercial decisions using compiled rows
        run: python -m unittest -v test_phase1c_policy_decision
      - name: Test deal decision gates against 14 reference runs
        run: python -m unittest -v test_phase1c_deal_decision
